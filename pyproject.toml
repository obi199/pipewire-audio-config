[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipewire-audio-config"
version = "1.3.0"
description = "PipeWire and WirePlumber USB audio device configuration GUI and CLI"
readme = "README.md"
authors = [{ name = "Pete", email = "pete@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "PyQt5>=5.15.0",
]

[project.scripts]
pipewire-config = "pipewire_config.ui.main_window:main"
pipewire-config-cli = "pipewire_config.cli:main"

[tool.setuptools.packages.find]
include = ["pipewire_config*"]

[tool.setuptools.package-data]
pipewire_config = ["profiles/*.json"]
